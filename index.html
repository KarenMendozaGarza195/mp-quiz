<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MP Quiz">
<title>Know Your MPs</title>
<style>
:root{
  --bg:#ffffff; --surface:#f7f7f7; --text:#3c3c3c; --muted:#777; --line:#e5e5e5;
  --green:#58cc02; --green-dark:#46a302; --green-soft:#d7ffb8; --green-text:#58a700;
  --red:#ff4b4b; --red-dark:#ea2b2b; --red-soft:#ffdfe0; --red-text:#ea2b2b;
  --blue:#1cb0f6; --blue-dark:#1899d6; --blue-soft:#ddf4ff;
  --gold:#ffc800; --orange:#ff9600;
  --opt-bg:#fff; --opt-shadow:#e5e5e5;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#131f24; --surface:#1d2c33; --text:#f1f7fb; --muted:#93a3ab; --line:#37464f;
    --green-soft:#1f3a14; --green-text:#79d634; --red-soft:#3d1f22; --red-text:#ff7878;
    --blue-soft:#14313f; --opt-bg:#131f24; --opt-shadow:#37464f;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 "Nunito","Segoe UI",system-ui,-apple-system,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px 140px}
.hidden{display:none!important}

/* top stats */
.stats{display:flex;gap:18px;align-items:center;justify-content:flex-end;font-weight:800;padding:4px 0 16px}
.stat{display:flex;align-items:center;gap:6px}
.stat .ic{font-size:20px}
.stat.streak{color:var(--orange)} .stat.xp{color:var(--gold)} .stat.mast{color:var(--blue)}
.iconbtn{background:none;border:0;font-size:20px;padding:4px;opacity:.75}
.iconbtn:hover{opacity:1}

h1{font-size:28px;margin:0 0 4px;font-weight:900}
.sub{color:var(--muted);margin:0 0 24px}
h2{font-size:15px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:28px 0 10px;font-weight:800}

select{width:100%;padding:14px 16px;border-radius:14px;border:2px solid var(--line);border-bottom-width:4px;background:var(--opt-bg);color:var(--text);font:inherit;font-weight:700}

.levels{display:grid;gap:12px}
.level{display:flex;gap:14px;align-items:center;text-align:left;width:100%;padding:16px;border-radius:16px;border:2px solid var(--line);border-bottom-width:4px;background:var(--opt-bg)}
.level:hover:not(:disabled){background:var(--surface)}
.level:disabled{opacity:.5;cursor:not-allowed}
.level .num{flex:none;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:20px;color:#fff;background:var(--green);box-shadow:0 4px 0 var(--green-dark)}
.level:disabled .num{background:var(--line);box-shadow:0 4px 0 var(--opt-shadow)}
.level .t{font-weight:800;font-size:17px}
.level .d{color:var(--muted);font-size:14px}
.meter{height:8px;border-radius:8px;background:var(--line);overflow:hidden;margin-top:8px}
.meter i{display:block;height:100%;background:var(--blue);border-radius:8px}
.level .lock{margin-left:auto;font-size:20px}

.links{display:flex;gap:18px;flex-wrap:wrap;margin-top:28px}
.link{background:none;border:0;color:var(--blue);font-weight:800;padding:0;text-transform:uppercase;font-size:14px;letter-spacing:.04em}
.toggle{display:flex;align-items:center;gap:8px;margin-top:14px;color:var(--muted);font-size:14px}

/* lesson */
.lessontop{display:flex;align-items:center;gap:14px;padding:4px 0 24px}
.close{background:none;border:0;font-size:26px;color:var(--muted);line-height:1;padding:0 4px}
.bar{flex:1;height:16px;border-radius:16px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--green);border-radius:16px;transition:width .35s ease;box-shadow:inset 0 -4px 0 rgba(0,0,0,.08), inset 0 4px 0 rgba(255,255,255,.25)}
.combo{font-weight:900;color:var(--orange);min-width:52px;text-align:right}

.prompt{font-size:22px;font-weight:900;margin:0 0 18px}
.tag{display:inline-block;font-size:12px;font-weight:900;color:#a560e8;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.card{display:flex;justify-content:center;margin-bottom:22px}
.photo{height:230px;width:142px;object-fit:cover;border-radius:16px;border:2px solid var(--line);background:var(--surface)}
.bigtext{width:100%;padding:28px 20px;border-radius:16px;border:2px solid var(--line);text-align:center}
.bigtext .main{font-size:26px;font-weight:900}
.bigtext .prov{color:var(--muted);font-weight:700;margin-top:4px}

.opts{display:grid;gap:12px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;width:100%;padding:14px 16px;border-radius:14px;border:2px solid var(--line);border-bottom-width:4px;background:var(--opt-bg);font-weight:700;font-size:17px}
.opt:hover:not(:disabled){background:var(--surface)}
.opt .k{flex:none;width:28px;height:28px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;color:var(--muted)}
.opt.picked{border-color:var(--blue);background:var(--blue-soft)}
.opt.right{border-color:var(--green);background:var(--green-soft);color:var(--green-text)}
.opt.wrong{border-color:var(--red);background:var(--red-soft);color:var(--red-text)}
.opt:disabled{cursor:default}

/* footer */
.foot{position:fixed;left:0;right:0;bottom:0;border-top:2px solid var(--line);background:var(--bg)}
.foot.ok{background:var(--green-soft);border-color:transparent}
.foot.bad{background:var(--red-soft);border-color:transparent}
.footin{max-width:640px;margin:0 auto;padding:16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.fb{flex:1;min-width:200px;display:flex;gap:12px;align-items:center}
.fb img{width:52px;height:84px;object-fit:cover;border-radius:10px;flex:none}
.fb .h{font-size:22px;font-weight:900}
.foot.ok .h{color:var(--green-text)} .foot.bad .h,.foot.bad .ans{color:var(--red-text)}
.fb .ans{font-weight:700}
.btn{border:0;border-radius:14px;padding:14px 28px;font-weight:900;text-transform:uppercase;letter-spacing:.05em;color:#fff;background:var(--green);box-shadow:0 4px 0 var(--green-dark);min-width:150px}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--green-dark)}
.btn.red{background:var(--red);box-shadow:0 4px 0 var(--red-dark)}
.btn.blue{background:var(--blue);box-shadow:0 4px 0 var(--blue-dark)}
.btn:disabled{background:var(--line);box-shadow:0 4px 0 var(--opt-shadow);color:var(--muted);cursor:default}
.footin .btn{margin-left:auto}

/* results */
.done{text-align:center;padding-top:24px}
.done .big{font-size:56px}
.done h1{color:var(--gold)}
.tiles{display:flex;gap:12px;justify-content:center;margin:24px 0}
.tile{flex:1;max-width:150px;border-radius:16px;border:2px solid var(--gold);overflow:hidden}
.tile .l{background:var(--gold);color:#fff;font-weight:900;font-size:13px;text-transform:uppercase;padding:4px}
.tile .v{font-size:24px;font-weight:900;padding:12px 4px}
.tile.g{border-color:var(--green)} .tile.g .l{background:var(--green)}
.tile.b{border-color:var(--blue)} .tile.b .l{background:var(--blue)}
.review{text-align:left;margin-top:16px}
.rv{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:2px solid var(--line)}
.rv img{width:44px;height:71px;object-fit:cover;border-radius:8px;flex:none}
.rv .n{font-weight:800} .rv .r{color:var(--muted);font-size:14px}

/* study grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:14px}
.gcard{border:2px solid var(--line);border-radius:14px;padding:8px;text-align:center}
.gcard img{width:100%;aspect-ratio:142/230;object-fit:cover;border-radius:10px}
.gcard .n{font-weight:800;font-size:14px;margin-top:6px}
.gcard .r{color:var(--muted);font-size:12px}
.gcard .s{font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.05em;margin-top:4px}

@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.04)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.pop{animation:pop .25s ease} .shake{animation:shake .3s ease}
@media (max-width:480px){.photo{height:200px;width:124px}.prompt{font-size:19px}.bigtext .main{font-size:22px}.btn{min-width:0;width:100%}.footin .btn{margin-left:0}}
</style>
</head>
<body>

<!-- HOME -->
<div id="home" class="wrap">
  <div class="stats">
    <span class="stat streak" title="Day streak"><span class="ic">🔥</span><span id="sStreak">0</span></span>
    <span class="stat xp" title="Total XP"><span class="ic">⚡</span><span id="sXp">0</span></span>
    <span class="stat mast" title="Mastered cards in this deck"><span class="ic">🎓</span><span id="sMast">0</span></span>
    <button class="iconbtn" id="soundBtn" title="Sound on/off">🔊</button>
  </div>
  <h1>Know Your MPs</h1>
  <p class="sub">Liberal caucus · <span id="deckCount"></span></p>

  <h2>Deck</h2>
  <select id="deck"></select>

  <h2>Pick a level</h2>
  <div class="levels" id="levels"></div>
  <label class="toggle"><input type="checkbox" id="unlockAll"> Unlock all levels</label>

  <div class="links">
    <button class="link" id="studyBtn">Study the deck</button>
    <button class="link" id="resetBtn" style="color:var(--red)">Reset progress</button>
  </div>
</div>

<!-- LESSON -->
<div id="lesson" class="wrap hidden">
  <div class="lessontop">
    <button class="close" id="quitBtn" title="Quit lesson">✕</button>
    <div class="bar"><i id="bar"></i></div>
    <div class="combo" id="combo"></div>
  </div>
  <div id="q"></div>
</div>
<div class="foot hidden" id="foot"><div class="footin">
  <div class="fb" id="fb"></div>
  <button class="btn" id="footBtn">Check</button>
</div></div>

<!-- RESULTS -->
<div id="results" class="wrap hidden"></div>

<!-- STUDY -->
<div id="study" class="wrap hidden"></div>

function dayStr(d){ return d.toLocaleDateString('en-CA'); }
function liveStreak(){
  if (!S.lastDay) return 0;
  const today = dayStr(new Date()), y = dayStr(new Date(Date.now()-864e5));
  return (S.lastDay === today || S.lastDay === y) ? S.streak : 0;
}
function bumpStreak(){
  const today = dayStr(new Date()), y = dayStr(new Date(Date.now()-864e5));
  if (S.lastDay === today) return;
  S.streak = (S.lastDay === y) ? S.streak + 1 : 1;

}

}
function cardsFor(level, ids){
  return LEVELS[level-1].kinds.flatMap(k => ids.map(id => ({key:`${k}:${id}`, kind:k, id})));
}
const box = key => (S.cards[key] && S.cards[key].box) || 0;
function levelProgress(level, ids){
  const cs = cardsFor(level, ids);
  const m = cs.filter(c => box(c.key) >= MASTERED_BOX).length;
  const seen = cs.filter(c => S.cards[c.key]).length;
  return {total:cs.length, mastered:m, seen};
}
function unlocked(level){
  if (S.unlockAll || level === 1) return true;
  return (S.best[level-1] || 0) >= 80;
}

/* ---------- sound ---------- */
let AC;
function beep(ok){
  if (!S.sound) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const notes = ok ? [660, 880] : [220, 180];
    notes.forEach((f,i) => {
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = ok ? 'triangle' : 'sawtooth'; o.frequency.value = f;
      const t = AC.currentTime + i*0.09;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(ok?0.18:0.08, t+0.01); g.gain.exponentialRampToValueAtTime(0.0001, t+0.16);
      o.connect(g).connect(AC.destination); o.start(t); o.stop(t+0.18);
    });
  } catch(e){}
}

/* ---------- home ---------- */
function renderHome(){
  const ids = deckIds(S.deck);
  const sel = $('deck');
  if (!sel.options.length){
    const provs = [...new Set(MPS.map(m=>m.prov))].sort();
    const opt = (v,l) => `<option value="${esc(v)}">${esc(l)}</option>`;
    sel.innerHTML = opt('all', `All Liberal MPs (${MPS.length})`)
      + opt('video', `This video's MPs (${VIDEO.size})`)
      + `<optgroup label="By province">` + provs.map(p => opt(p, `${p} (${deckIds(p).length})`)).join('') + `</optgroup>`;
  }
  sel.value = S.deck;
  $('deckCount').textContent = `${deckLabel(S.deck)} · ${ids.length} MPs`;
  $('sStreak').textContent = liveStreak();
  $('sXp').textContent = S.xp;
  $('sMast').textContent = LEVELS.reduce((a,L)=>a+levelProgress(L.n, ids).mastered, 0);
  $('soundBtn').textContent = S.sound ? '🔊' : '🔇';
  $('unlockAll').checked = S.unlockAll;
  $('levels').innerHTML = LEVELS.map(L => {
    const p = levelProgress(L.n, ids), ok = unlocked(L.n);
    const pct = p.total ? Math.round(100*p.mastered/p.total) : 0;
    const status = ok
      ? `${p.mastered} of ${p.total} mastered · ${p.seen} seen`
      : `Locked · score 80% in Level ${L.n-1} to open`;
    return `<button class="level" data-level="${L.n}" ${ok?'':'disabled'}>
      <span class="num">${L.n}</span>
      <span style="flex:1;min-width:0"><div class="t">${L.title}</div><div class="d">${L.desc}</div>
      <div class="d" style="margin-top:4px">${status}</div>
      <div class="meter"><i style="width:${pct}%"></i></div></span>
      ${ok?'':'<span class="lock">🔒</span>'}</button>`;
  }).join('');
  document.querySelectorAll('.level').forEach(b => b.onclick = () => startLesson(+b.dataset.level));
  show('home');
}
$('deck').onchange = e => { S.deck = e.target.value; save(); renderHome(); };
$('unlockAll').onchange = e => { S.unlockAll = e.target.checked; save(); renderHome(); };
$('soundBtn').onclick = () => { S.sound = !S.sound; save(); renderHome(); };
$('resetBtn').onclick = () => {
  if (confirm('Erase all XP, streak and card progress?')) { const keepSound = S.sound; S = freshState(); S.sound = keepSound; save(); renderHome(); }
};
$('studyBtn').onclick = renderStudy;

/* ---------- lesson ---------- */
let L = null;

function pickCards(level, ids){
  const now = Date.now();
  const all = cardsFor(level, ids);
  const due = shuffle(all.filter(c => S.cards[c.key] && S.cards[c.key].due <= now))
    .sort((a,b) => box(a.key) - box(b.key));
  const fresh = shuffle(all.filter(c => !S.cards[c.key]));
  const later = all.filter(c => S.cards[c.key] && S.cards[c.key].due > now)
    .sort((a,b) => S.cards[a.key].due - S.cards[b.key].due);
  const size = Math.min(LESSON_SIZE, all.length);
  // mostly review what's due, but always mix in a few new faces
  const nNew = Math.min(fresh.length, Math.max(3, size - due.length));
  // one card per MP per lesson where possible, so level 3's two directions don't give each other away
  const out = [], people = new Set();
  const add = (c, unique) => { if (out.length < size && !out.includes(c) && !(unique && people.has(c.id))) { out.push(c); people.add(c.id); } };
  for (const unique of [true, false]) {
    due.slice(0, size - nNew).forEach(c => add(c, unique));
    fresh.slice(0, nNew).forEach(c => add(c, unique));
    for (const pool of [due, fresh, later]) pool.forEach(c => add(c, unique));
  }
  return shuffle(out);
}

function makeQuestion(card){
  const mp = BY_ID[card.id];
  const field = (card.kind === 'fn' || card.kind === 'rn') ? 'name' : 'riding';
  const answer = mp[field];
  const others = MPS.filter(m => m.id !== mp.id);
  const same = shuffle(others.filter(m => m.prov === mp.prov));
  const rest = shuffle(others.filter(m => m.prov !== mp.prov));
  const opts = [answer];
  for (const m of same.concat(rest)) { if (opts.length >= 4) break; if (!opts.includes(m[field])) opts.push(m[field]); }
  return {card, mp, field, answer, options: shuffle(opts)};
}

function startLesson(level){
  const ids = deckIds(S.deck);
  const queue = pickCards(level, ids);
  if (!queue.length) return;
  // fetch the lesson's photos up front so they don't pop in on slow phone connections
  queue.forEach(c => { new Image().src = photo(c.id); });
  L = {level, queue, total: queue.length, done: 0, firstTry: {}, correctFirst: 0, combo: 0, bestCombo: 0, xp: 0, missed: [], q: null, answered: false, picked: null};
  show('lesson');
  nextQuestion();
}

function nextQuestion(){
  if (!L.queue.length) return finishLesson();
  L.q = makeQuestion(L.queue[0]);
  L.answered = false; L.picked = null;
  const {card, mp, options} = L.q;
  const isNew = !S.cards[card.key];
  let head, body;
  if (card.kind === 'fn'){ head = 'Who is this?'; body = `<div class="card"><img class="photo" src="${photo(mp.id)}" alt=""></div>`; }
  else if (card.kind === 'fr'){ head = 'Which riding does this MP represent?'; body = `<div class="card"><img class="photo" src="${photo(mp.id)}" alt=""></div>`; }
  else if (card.kind === 'nr'){ head = 'Which riding?'; body = `<div class="card"><div class="bigtext"><div class="main">${esc(mp.name)}</div></div></div>`; }
  else { head = 'Who is the MP for this riding?'; body = `<div class="card"><div class="bigtext"><div class="main">${esc(mp.riding)}</div><div class="prov">${esc(mp.prov)}</div></div></div>`; }
  $('q').innerHTML = `${isNew ? '<div class="tag">✦ New card</div>' : ''}
    <p class="prompt">${head}</p>${body}
    <div class="opts">${options.map((o,i) => `<button class="opt" data-i="${i}"><span class="k">${i+1}</span><span>${esc(o)}</span></button>`).join('')}</div>`;
  document.querySelectorAll('.opt').forEach(b => b.onclick = () => pick(+b.dataset.i));
  $('bar').style.width = `${100*L.done/L.total}%`;
  $('combo').textContent = L.combo >= 2 ? `🔥 ${L.combo}` : '';
  const foot = $('foot'); foot.className = 'foot'; $('fb').innerHTML = '';
  $('footBtn').textContent = 'Check'; $('footBtn').className = 'btn'; $('footBtn').disabled = true;
}

function pick(i){
  if (L.answered) return;
  L.picked = i;
  document.querySelectorAll('.opt').forEach(b => b.classList.toggle('picked', +b.dataset.i === i));
  $('footBtn').disabled = false;
}

function check(){
  const {card, mp, answer, options} = L.q;
  const ok = options[L.picked] === answer;
  L.answered = true;
  const first = !(card.key in L.firstTry);
  if (first) L.firstTry[card.key] = ok;

  // spaced repetition: only the first try in a lesson moves the card between boxes
  const st = S.cards[card.key] || {box:0, due:0, right:0, wrong:0};
  if (first){
    if (ok){ st.box = Math.min(st.box + 1, MAX_BOX); st.right++; }
    else { st.box = 0; st.wrong++; }
    st.due = Date.now() + INTERVALS[st.box];
    S.cards[card.key] = st;
  }

  L.queue.shift();
  if (ok){
    L.done++; L.combo++; L.bestCombo = Math.max(L.bestCombo, L.combo);
    if (first) L.correctFirst++;
    let gain = first ? 10 : 5;
    if (L.combo > 0 && L.combo % 5 === 0) gain += 5;
    L.xp += gain;
  } else {
    L.combo = 0;
    if (!L.missed.includes(mp.id)) L.missed.push(mp.id);
    // missed card comes back a few questions later in this lesson
    L.queue.splice(Math.min(3, L.queue.length), 0, card);
  }
  save();
  beep(ok);

  document.querySelectorAll('.opt').forEach(b => {
    b.disabled = true; b.classList.remove('picked');
    const v = options[+b.dataset.i];
    if (v === answer) b.classList.add('right');
    else if (+b.dataset.i === L.picked) b.classList.add('wrong', 'shake');
  });
  $('bar').style.width = `${100*L.done/L.total}%`;
  $('combo').textContent = L.combo >= 2 ? `🔥 ${L.combo}` : '';

  const cheers = ['Nice!','Great job!','Correct!','You got it!','Excellent!'];
  $('foot').className = 'foot ' + (ok ? 'ok' : 'bad');
  $('fb').innerHTML = `<img src="${photo(mp.id)}" alt="">
    <div><div class="h">${ok ? cheers[Math.floor(Math.random()*cheers.length)] : 'Correct answer:'}</div>
    <div class="ans">${esc(mp.name)} · ${esc(mp.riding)} (${PROV_ABBR[mp.prov]||esc(mp.prov)})</div></div>`;
  $('footBtn').textContent = 'Continue';
  $('footBtn').className = 'btn' + (ok ? '' : ' red');
  $('footBtn').classList.add('pop');
}

$('footBtn').onclick = () => {
  if (!L) return;
  if (!L.answered){ if (L.picked !== null) check(); }
  else nextQuestion();
};
$('quitBtn').onclick = () => { if (confirm('Quit this lesson? Answers so far are saved.')) { L = null; $('foot').classList.add('hidden'); renderHome(); } };

document.addEventListener('keydown', e => {
  if ($('lesson').classList.contains('hidden') || !L) return;
  if (!L.answered && e.key >= '1' && e.key <= '4'){ const i = +e.key - 1; if (i < L.q.options.length) { pick(i); } }
  if (e.key === 'Enter'){ e.preventDefault(); $('footBtn').click(); }
});

function finishLesson(){
  $('foot').classList.add('hidden');
  const acc = Math.round(100 * L.correctFirst / L.total);
  if (acc === 100) L.xp += 10;
  S.xp += L.xp;
  S.best[L.level] = Math.max(S.best[L.level] || 0, acc);
  bumpStreak();
  save();
  const unlockedNow = L.level < 3 && acc >= 80 && !S.unlockAll;
  const lvl = L.level;
  $('results').innerHTML = `<div class="done">
    <div class="big">${acc === 100 ? '🏆' : acc >= 80 ? '🎉' : '💪'}</div>
    <h1>${acc === 100 ? 'Perfect lesson!' : 'Lesson complete!'}</h1>
    <p class="sub">${deckLabel(S.deck)} · Level ${lvl}${unlockedNow ? ` · Level ${lvl+1} is open` : ''}</p>
    <div class="tiles">
      <div class="tile"><div class="l">Total XP</div><div class="v">⚡ ${L.xp}</div></div>
      <div class="tile g"><div class="l">Accuracy</div><div class="v">🎯 ${acc}%</div></div>
      <div class="tile b"><div class="l">Streak</div><div class="v">🔥 ${S.streak}</div></div>
    </div>
    ${L.missed.length ? `<h2>Review these</h2><div class="review">${L.missed.map(id => { const m = BY_ID[id]; return `<div class="rv"><img src="${photo(id)}" alt=""><div><div class="n">${esc(m.name)}</div><div class="r">${esc(m.riding)} · ${esc(m.prov)}</div></div></div>`; }).join('')}</div>` : ''}
    <div style="display:grid;gap:12px;margin-top:28px">
      <button class="btn" id="againBtn">Next lesson</button>
      <button class="btn blue" id="homeBtn">Back to levels</button>
    </div></div>`;
  $('againBtn').onclick = () => startLesson(lvl);
  $('homeBtn').onclick = renderHome;
  L = null;
  show('results');
}

/* ---------- study grid ---------- */
function renderStudy(){
  const ids = deckIds(S.deck);
  const label = id => {
    const b = Math.min(...LEVELS.flatMap(Lv => Lv.kinds.map(k => box(`${k}:${id}`))));
    const seen = LEVELS.some(Lv => Lv.kinds.some(k => S.cards[`${k}:${id}`]));
    if (b >= MASTERED_BOX) return '<div class="s" style="color:var(--blue)">Mastered</div>';
    return seen ? '<div class="s" style="color:var(--orange)">Learning</div>' : '<div class="s" style="color:var(--muted)">New</div>';
  };
  const sorted = ids.map(id => BY_ID[id]).sort((a,b) => a.last.localeCompare(b.last, 'fr'));
  $('study').innerHTML = `<div class="lessontop"><button class="close" id="studyClose" title="Back">✕</button>
    <div style="font-weight:900;font-size:20px">${deckLabel(S.deck)} · ${ids.length}</div></div>
    <div class="grid">${sorted.map(m => `<div class="gcard"><img src="${photo(m.id)}" alt="" loading="lazy">
      <div class="n">${esc(m.name)}</div><div class="r">${esc(m.riding)} · ${PROV_ABBR[m.prov]||esc(m.prov)}</div>${label(m.id)}</div>`).join('')}</div>`;
  $('studyClose').onclick = renderHome;
  show('study');
  window.scrollTo(0,0);
}

renderHome();
</script>
</body>
</html>
