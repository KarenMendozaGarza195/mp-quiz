<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MP Quiz">
<meta name="theme-color" content="#ffffff">
<title>Know Your MPs</title>
<style>
:root{
  --red:#d0242b; --red-dark:#a91c22; --red-bg:#fdecee; --red-line:#f1b9be;
  --ink:#1c1c1e; --ink2:#5f6368; --ink3:#8a8a90; --bg:#f2f2f7; --card:#fff; --line:#e3e3e8;
  --navy:#1f2a37; --navy2:#283646; --navy-track:#34445a; --navy-text:#c3ccd6; --coral:#ff6b7c;
  --green:#1b7f3b; --green-bg:#e6f4ea; --green-line:#9fd3ae;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.hidden{display:none!important}
.page{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:150px}

/* app header */
.hdr{position:sticky;top:0;z-index:5;background:#fff;display:flex;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top)) 16px 12px;border-bottom:1px solid #e9e9ee}
.hdr .tt{flex:1;min-width:0}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.18em;color:var(--red);text-transform:uppercase}
.big{font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.circ{width:44px;height:44px;border-radius:50%;background:#f1f1f4;border:0;display:flex;align-items:center;justify-content:center;font-size:18px;flex:0 0 44px;color:var(--ink)}
.circ svg{width:20px;height:20px}

/* deck pills */
.filters{background:#fff;display:flex;gap:8px;padding:12px 16px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid #e9e9ee}
.filters::-webkit-scrollbar{display:none}
.pill{border:2px solid var(--red);background:#fff;color:var(--red);border-radius:22px;padding:6px 14px;font-weight:600;font-size:15px;white-space:nowrap;flex:none}
.pill.on{background:var(--red);color:#fff}
.pill small{font-weight:500;opacity:.8;margin-left:3px}
#decks{padding-top:0}
.pill.sub{border-color:var(--line);color:var(--ink2);font-size:14px;padding:5px 12px}
.pill.sub.on{background:var(--ink);border-color:var(--ink);color:#fff}
.spell{width:100%;padding:15px 16px;border-radius:16px;border:2px solid var(--line);font:inherit;font-size:20px;font-weight:600;background:#fff;color:var(--ink)}
.spell:focus{outline:none;border-color:var(--red)}
.spell.right{border-color:var(--green-line);background:var(--green-bg);color:var(--green)}
.spell.wrong{border-color:var(--red-line);background:var(--red-bg);color:var(--red)}
.hint{background:none;border:0;color:var(--red);font-weight:700;padding:12px 0 0;font-size:15px}
.hinttext{font-size:20px;letter-spacing:.12em;font-weight:700;color:var(--ink2);margin-top:10px}

.feed{padding:14px;display:flex;flex-direction:column;gap:12px}
.sec{font-size:13px;font-weight:700;letter-spacing:.12em;color:var(--ink3);text-transform:uppercase;margin:8px 4px -2px}

/* navy progress card */
.drop{background:var(--navy);color:#fff;border-radius:22px;padding:14px 16px 16px}
.drop-top{display:flex;align-items:center;gap:8px;white-space:nowrap;font-size:12.5px;font-weight:800;letter-spacing:.14em;color:var(--coral);text-transform:uppercase}
.live{width:9px;height:9px;border-radius:50%;background:var(--coral);animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,107,124,.7)}70%{box-shadow:0 0 0 8px rgba(255,107,124,0)}100%{box-shadow:0 0 0 0 rgba(255,107,124,0)}}
.drop-top .of{margin-left:auto;color:#8e9bab;letter-spacing:.06em;min-width:0;overflow:hidden;text-overflow:ellipsis}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.num b{display:block;font-size:26px;font-weight:800;line-height:1.1}
.num span{font-size:13px;color:var(--navy-text)}
.track{display:flex;gap:5px;margin-top:16px}
.track i{flex:1;height:6px;border-radius:3px;background:var(--navy-track)}
.track i.done{background:var(--red)}
.streak{display:flex;justify-content:space-between;margin-top:8px;font-size:12.5px;color:var(--navy-text)}
.streak b{color:#fff}

/* level cards */
.fc{display:block;width:100%;text-align:left;background:#fff;border:0;border-radius:22px;padding:16px 16px 14px;position:relative}
.fc.next{box-shadow:inset 4px 0 0 var(--red)}
.fc:disabled{cursor:not-allowed}
.fc:disabled .t,.fc:disabled .d{color:var(--ink3)}
.fc-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.tag{background:var(--red-bg);border:1px solid var(--red-line);color:var(--red);font-weight:700;font-size:13px;border-radius:8px;padding:3px 9px}
.tag.grey{background:#f1f1f4;border-color:var(--line);color:var(--ink3)}
.meta{color:var(--ink3);font-size:13.5px}
.fc .t{margin:0 0 4px;font-size:17px;line-height:1.3;font-weight:700}
.fc .d{margin:0 0 10px;color:var(--ink2);font-size:14.5px;line-height:1.4}
.bar{height:6px;border-radius:3px;background:#ececf0;overflow:hidden;margin:0 0 12px}
.bar i{display:block;height:100%;background:var(--red);border-radius:3px}
.go{color:var(--red);font-weight:700;font-size:16px}
.fc:disabled .go{color:var(--ink3)}

.row{display:flex;justify-content:space-between;align-items:center;background:#fff;border-radius:16px;padding:14px 16px;font-size:15px}
.switch{appearance:none;width:51px;height:31px;border-radius:16px;background:#e3e3e8;position:relative;cursor:pointer;transition:background .2s;flex:none}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:left .2s}
.switch:checked{background:var(--red)} .switch:checked::after{left:22px}
.links{display:flex;gap:10px}
.links button{flex:1;background:#fff;border:0;border-radius:16px;padding:14px;font-weight:700;font-size:15px;color:var(--red)}
.links .muted{color:var(--ink2)}

/* lesson */
.lhdr{gap:14px}
.prog{flex:1;height:10px;border-radius:5px;background:#ececf0;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--red);border-radius:5px;transition:width .35s ease}
.combo{font-weight:800;color:var(--red);font-size:15px;min-width:44px;text-align:right}
.qwrap{padding:18px 16px}
.qtag{margin-bottom:10px}
.prompt{font-size:22px;font-weight:800;letter-spacing:-.01em;margin:0 0 16px}
.card{display:flex;justify-content:center;margin-bottom:18px}
.photo{height:230px;width:142px;object-fit:cover;border-radius:18px;background:#e9e9ee}
.bigtext{width:100%;padding:26px 18px;border-radius:22px;background:#fff;text-align:center}
.bigtext .main{font-size:24px;font-weight:800;letter-spacing:-.01em}
.bigtext .prov{color:var(--ink3);font-weight:600;margin-top:4px;font-size:14px}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;width:100%;padding:14px 16px;border-radius:16px;border:2px solid transparent;background:#fff;font-weight:600;font-size:17px}
.opt .k{flex:none;width:26px;height:26px;border-radius:50%;background:#f1f1f4;display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--ink3)}
.opt.picked{border-color:var(--red)} .opt.picked .k{background:var(--red);color:#fff}
.opt.right{border-color:var(--green-line);background:var(--green-bg);color:var(--green)} .opt.right .k{background:var(--green);color:#fff}
.opt.wrong{border-color:var(--red-line);background:var(--red-bg);color:var(--red)} .opt.wrong .k{background:var(--red);color:#fff}
.opt:disabled{cursor:default}

/* bottom sheet */
.foot{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);z-index:6}
.foot.ok{background:var(--green-bg);border-color:var(--green-line)}
.foot.bad{background:var(--red-bg);border-color:var(--red-line)}
.footin{max-width:560px;margin:0 auto;padding:14px 16px calc(14px + env(safe-area-inset-bottom))}
.fb{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.fb:empty{display:none}
.fb img{width:46px;height:74px;object-fit:cover;border-radius:10px;flex:none}
.fb .h{font-size:19px;font-weight:800}
.foot.ok .h{color:var(--green)} .foot.bad .h{color:var(--red)}
.fb .ans{font-weight:600;font-size:15px}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:14px;font-weight:700;font-size:16px;color:#fff;background:var(--red)}
.btn:active{background:var(--red-dark)}
.btn:disabled{background:#e3e3e8;color:var(--ink3);cursor:default}
.btn.ghost{background:#fff;color:var(--red);border:2px solid var(--red)}
.foot.ok .btn{background:var(--green)}

/* results */
.res{padding:16px;display:flex;flex-direction:column;gap:12px}
.res .drop h2{margin:10px 0 2px;font-size:24px;font-weight:800}
.res .drop small{color:var(--navy-text);font-size:13.5px}
.rv{display:flex;gap:12px;align-items:center;background:#fff;border-radius:16px;padding:10px 12px}
.rv img{width:40px;height:64px;object-fit:cover;border-radius:8px;flex:none}
.rv .n{font-weight:700} .rv .r{color:var(--ink2);font-size:14px}

/* study grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;padding:14px}
.gcard{background:#fff;border-radius:18px;padding:8px 8px 10px;text-align:center}
.gcard img{width:100%;aspect-ratio:142/230;object-fit:cover;border-radius:12px}
.gcard .n{font-weight:700;font-size:14px;margin-top:6px;line-height:1.25}
.gcard .r{color:var(--ink2);font-size:12px;margin-top:2px}
.gcard .s{display:inline-block;margin-top:6px}
.gcard .tag{font-size:11px;padding:1px 7px}

@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.03)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.pop{animation:pop .25s ease} .shake{animation:shake .3s ease}
@media (prefers-reduced-motion:reduce){.live,.pop,.shake{animation:none}.prog i{transition:none}}
@media (max-width:380px){.photo{height:200px;width:124px}.prompt{font-size:20px}}
</style>
</head>
<body>

<!-- HOME -->
<div id="home" class="page">
  <header class="hdr">
    <div class="tt"><div class="eyebrow">MP Quiz</div><div class="big">Know Your MPs</div></div>
    <button class="circ" id="soundBtn" title="Sound on/off" aria-label="Sound on/off"></button>
  </header>
  <nav class="filters" id="groups" aria-label="Party"></nav>
  <nav class="filters" id="decks" aria-label="Province"></nav>
  <div class="feed">
    <div class="drop">
      <div class="drop-top"><span class="live"></span>Your progress<span class="of" id="deckName"></span></div>
      <div class="nums">
        <div class="num"><b id="sStreak">0</b><span>day streak</span></div>
        <div class="num"><b id="sXp">0</b><span>total XP</span></div>
        <div class="num"><b id="sMast">0</b><span>mastered</span></div>
      </div>
      <div class="track" id="goalTrack"></div>
      <div class="streak"><span id="goalText"></span><span>Daily goal</span></div>
    </div>

    <div class="sec">Levels</div>
    <div id="levels" style="display:flex;flex-direction:column;gap:12px"></div>

    <div class="sec">More</div>
    <label class="row">Unlock all levels <input type="checkbox" class="switch" id="unlockAll"></label>
    <div class="links">
      <button id="studyBtn">Study the deck</button>
      <button id="resetBtn" class="muted">Reset progress</button>
    </div>
  </div>
</div>

<!-- LESSON -->
<div id="lesson" class="page hidden">
  <header class="hdr lhdr">
    <button class="circ" id="quitBtn" title="Quit lesson" aria-label="Quit lesson">✕</button>
    <div class="prog"><i id="bar"></i></div>
    <div class="combo" id="combo"></div>
  </header>
  <div class="qwrap" id="q"></div>
</div>
<div class="foot hidden" id="foot"><div class="footin">
  <div class="fb" id="fb"></div>
  <button class="btn" id="footBtn">Check</button>
</div></div>

<!-- RESULTS -->
<div id="results" class="page hidden"></div>

<!-- STUDY -->
<div id="study" class="page hidden"></div>

/* ---------- storage ---------- */
const KEY = 'mpQuiz.v1';
function freshState(){ return {xp:0, streak:0, lastDay:null, cards:{}, best:{}, group:'Liberal', deck:'all', unlockAll:false, sound:true, today:{day:null, lessons:0}}; }
let S;
try { S = Object.assign(freshState(), JSON.parse(localStorage.getItem(KEY) || '{}')); } catch(e){ S = freshState(); }
if (!GROUPS.some(g => g[0] === S.group)) S.group = 'Liberal';
if (S.deck !== 'all' && !MPS.some(m => inGroup(m, S.group) && m.prov === S.deck)) S.deck = 'all';
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }

function dayStr(d){ return d.toLocaleDateString('en-CA'); }
function liveStreak(){
  if (!S.lastDay) return 0;
  const today = dayStr(new Date()), y = dayStr(new Date(Date.now()-864e5));
  return (S.lastDay === today || S.lastDay === y) ? S.streak : 0;
}
function bumpStreak(){
  const today = dayStr(new Date()), y = dayStr(new Date(Date.now()-864e5));
  if (S.today.day !== today) S.today = {day: today, lessons: 0};
  S.today.lessons++;
  if (S.lastDay === today) return;
  S.streak = (S.lastDay === y) ? S.streak + 1 : 1;
  S.lastDay = today;
}
const lessonsToday = () => S.today.day === dayStr(new Date()) ? S.today.lessons : 0;

function deckIds(deck){
  return MPS.filter(m => inGroup(m, S.group) && (deck === 'all' || m.prov === deck)).map(m=>m.id);
}
function deckLabel(deck){
  const g = S.group === 'all' ? 'All MPs' : S.group === 'Senate' ? 'Senate leads' : `${S.group} MPs`;
  return deck === 'all' ? g : `${g} · ${deck}`;
}
function cardsFor(level, ids){
  return LEVELS[level-1].kinds.flatMap(k => ids.map(id => ({key:`${k}:${id}`, kind:k, id})));
}
const box = key => (S.cards[key] && S.cards[key].box) || 0;
function levelProgress(level, ids){
  const cs = cardsFor(level, ids);
  const m = cs.filter(c => box(c.key) >= MASTERED_BOX).length;
  const seen = cs.filter(c => S.cards[c.key]).length;
  return {total:cs.length, mastered:m, seen};
}
function unlocked(level){
  if (S.unlockAll || level === 1) return true;
  return (S.best[level-1] || 0) >= 80;
}

/* ---------- sound ---------- */
let AC;
function beep(ok){
  if (!S.sound) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const notes = ok ? [660, 880] : [220, 180];
    notes.forEach((f,i) => {
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = ok ? 'triangle' : 'sawtooth'; o.frequency.value = f;
      const t = AC.currentTime + i*0.09;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(ok?0.18:0.08, t+0.01); g.gain.exponentialRampToValueAtTime(0.0001, t+0.16);
      o.connect(g).connect(AC.destination); o.start(t); o.stop(t+0.18);
    });
  } catch(e){}
}

/* ---------- spelling ---------- */
// ignore case, accents, hyphens, apostrophes and spaces; middle initials are optional
const letters = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z ]/g, ' ').split(/\s+/).filter(Boolean);
function lev(a, b){
  const d = Array.from({length: a.length + 1}, (_, i) => [i]);
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++)
  {
    d[i][j] = Math.min(d[i-1][j] + 1, d[i][j-1] + 1, d[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1));
    if (i > 1 && j > 1 && a[i-1] === b[j-2] && a[i-2] === b[j-1]) d[i][j] = Math.min(d[i][j], d[i-2][j-2] + 1); // swapped letters = one typo
  }
  return d[a.length][b.length];
}
function spellDistance(typed, name){
  const t = letters(typed).join(''), w = letters(name);
  return Math.min(lev(t, w.join('')), lev(t, w.filter(x => x.length > 1).join('')));
}

  $('sStreak').textContent = liveStreak();
  $('sXp').textContent = S.xp;
  $('sMast').textContent = LEVELS.reduce((a,L)=>a+levelProgress(L.n, ids).mastered, 0);
  const done = lessonsToday();
  $('goalTrack').innerHTML = Array.from({length: DAILY_GOAL}, (_,i) => `<i class="${i < done ? 'done' : ''}"></i>`).join('');
  $('goalText').innerHTML = done >= DAILY_GOAL ? `<b>Goal reached</b> · ${done} lessons today` : `You've done <b>${done} of ${DAILY_GOAL}</b> lessons today`;
  $('soundBtn').innerHTML = S.sound ? ICON_SOUND : ICON_MUTE;
  $('unlockAll').checked = S.unlockAll;

  const nextLevel = [...LEVELS].reverse().find(L => unlocked(L.n));
  $('levels').innerHTML = LEVELS.map(L => {
    const p = levelProgress(L.n, ids), ok = unlocked(L.n);
    const pct = p.total ? Math.round(100*p.mastered/p.total) : 0;
    return `<button class="fc${ok && L === nextLevel ? ' next' : ''}" data-level="${L.n}" ${ok?'':'disabled'}>
      <div class="fc-top"><span class="tag${ok?'':' grey'}">Level ${L.n}</span><span class="meta">${ok ? `${p.mastered} of ${p.total} mastered` : '🔒 Locked'}</span></div>
      <div class="t">${L.title}</div>
      <div class="d">${ok ? L.desc : `Score 80% in Level ${L.n-1} to open.`}</div>
      ${ok ? `<div class="bar"><i style="width:${pct}%"></i></div><span class="go">${p.seen ? 'Continue' : 'Start'} →</span>` : ''}
    </button>`;
  }).join('');
  document.querySelectorAll('.fc[data-level]').forEach(b => b.onclick = () => startLesson(+b.dataset.level));
  show('home');
}
$('unlockAll').onchange = e => { S.unlockAll = e.target.checked; save(); renderHome(); };
$('soundBtn').onclick = () => { S.sound = !S.sound; save(); renderHome(); };
$('resetBtn').onclick = () => {
  if (confirm('Erase all XP, streak and card progress?')) { const keepSound = S.sound; S = freshState(); S.sound = keepSound; save(); renderHome(); }
};
$('studyBtn').onclick = renderStudy;

/* ---------- lesson ---------- */
let L = null;

function pickCards(level, ids){
  const now = Date.now();
  const all = cardsFor(level, ids);
  const due = shuffle(all.filter(c => S.cards[c.key] && S.cards[c.key].due <= now))
    .sort((a,b) => box(a.key) - box(b.key));
  const fresh = shuffle(all.filter(c => !S.cards[c.key]));
  const later = all.filter(c => S.cards[c.key] && S.cards[c.key].due > now)
    .sort((a,b) => S.cards[a.key].due - S.cards[b.key].due);
  const size = Math.min(LESSON_SIZE, all.length);
  // mostly review what's due, but always mix in a few new faces
  const nNew = Math.min(fresh.length, Math.max(3, size - due.length));
  // one card per MP per lesson where possible, so level 3's two directions don't give each other away
  const out = [], people = new Set();
  const add = (c, unique) => { if (out.length < size && !out.includes(c) && !(unique && people.has(c.id))) { out.push(c); people.add(c.id); } };
  for (const unique of [true, false]) {
    due.slice(0, size - nNew).forEach(c => add(c, unique));
    fresh.slice(0, nNew).forEach(c => add(c, unique));
    for (const pool of [due, fresh, later]) pool.forEach(c => add(c, unique));
  }
  return shuffle(out);
}

function makeQuestion(card){
  const mp = BY_ID[card.id];
  const field = answerField(mp, card.kind);
  const answer = mp[field];
  if (card.kind === 'sp') return {card, mp, field, answer, options: []};
  // wrong answers come from the group being played; tiny groups (Green) top up from everyone of the same kind
  const kin = m => m.id !== mp.id && m[field] && (m.party === 'Senate') === (mp.party === 'Senate');
  const pool = MPS.filter(m => kin(m) && inGroup(m, S.group));
  const wide = MPS.filter(kin);
  const opts = [answer];
  const add = list => { for (const m of list) { if (opts.length >= 4) break; if (!opts.includes(m[field])) opts.push(m[field]); } };
  if (card.kind === 'fn' && LOOK[mp.id]) {
    // level 1: wrong names come from the people whose portraits look most like this one
    const inPool = new Set(pool.map(m => m.id)), inWide = new Set(wide.map(m => m.id));
    let near = LOOK[mp.id].filter(id => inPool.has(id)).slice(0, 6);
    if (near.length < 3) near = near.concat(LOOK[mp.id].filter(id => inWide.has(id) && !near.includes(id))).slice(0, 6);
    add(shuffle(near).map(id => BY_ID[id]));
  }
  add(shuffle(pool.filter(m => m.prov === mp.prov)));
  add(shuffle(pool.filter(m => m.prov !== mp.prov)));
  add(shuffle(wide));
  return {card, mp, field, answer, options: shuffle(opts)};
}

function startLesson(level){
  const ids = deckIds(S.deck);
  const queue = pickCards(level, ids);
  if (!queue.length) return;
  // fetch the lesson's photos up front so they don't pop in on slow phone connections
  queue.forEach(c => { new Image().src = photo(c.id); });
  L = {level, queue, total: queue.length, done: 0, firstTry: {}, correctFirst: 0, combo: 0, bestCombo: 0, xp: 0, missed: [], q: null, answered: false, picked: null};
  show('lesson');
  nextQuestion();
}

function nextQuestion(){
  if (!L.queue.length) return finishLesson();
  L.q = makeQuestion(L.queue[0]);
  L.answered = false; L.picked = null; L.hint = false;
  const {card, mp, options, field} = L.q;
  const isNew = !S.cards[card.key];
  let head, body;
  if (card.kind === 'fn'){ head = 'Who is this?'; body = `<div class="card"><img class="photo" src="${photo(mp.id)}" alt=""></div>`; }
  else if (card.kind === 'fr'){ head = field === 'role' ? 'What is their Senate role?' : 'Which riding does this MP represent?'; body = `<div class="card"><img class="photo" src="${photo(mp.id)}" alt=""></div>`; }
  else if (card.kind === 'nr'){ head = field === 'role' ? 'What is their Senate role?' : 'Which riding?'; body = `<div class="card"><div class="bigtext"><div class="main">${esc(mp.name)}</div></div></div>`; }
  else if (card.kind === 'rn'){ head = mp.riding ? 'Who is the MP for this riding?' : 'Who holds this Senate role?'; body = `<div class="card"><div class="bigtext"><div class="main">${esc(mp.riding || mp.role)}</div><div class="prov">${esc(mp.prov)}</div></div></div>`; }
  else { head = 'Spell their full name'; body = `<div class="card"><img class="photo" src="${photo(mp.id)}" alt=""></div>
    <input class="spell" id="spell" type="text" autocomplete="off" autocorrect="off" autocapitalize="words" spellcheck="false" enterkeyhint="done" placeholder="First and last name" aria-label="Full name">
    <button class="hint" id="hintBtn">Show a hint</button><div class="hinttext hidden" id="hintText"></div>`; }
  $('q').innerHTML = `<div class="qtag"><span class="tag">Level ${L.level}</span>${isNew ? ' <span class="tag grey">New</span>' : ''}</div>
    <p class="prompt">${head}</p>${body}
    <div class="opts">${options.map((o,i) => `<button class="opt" data-i="${i}"><span class="k">${i+1}</span><span>${esc(o)}</span></button>`).join('')}</div>`;
  document.querySelectorAll('.opt').forEach(b => b.onclick = () => pick(+b.dataset.i));
  if (card.kind === 'sp') {
    $('spell').oninput = e => { $('footBtn').disabled = !e.target.value.trim(); };
    $('hintBtn').onclick = () => {
      L.hint = true; $('hintBtn').classList.add('hidden');
      $('hintText').textContent = mp.name.split(' ').map(w => w[0] + w.slice(1).replace(/[^\s\-.']/g, '_')).join('  ');
      $('hintText').classList.remove('hidden'); $('spell').focus();
    };
    setTimeout(() => $('spell').focus(), 50);
  }
  $('bar').style.width = `${100*L.done/L.total}%`;
  $('combo').textContent = L.combo >= 2 ? `🔥 ${L.combo}` : '';
  const foot = $('foot'); foot.className = 'foot'; $('fb').innerHTML = '';
  $('footBtn').textContent = 'Check'; $('footBtn').disabled = true;
}

function pick(i){
  if (L.answered) return;
  L.picked = i;
  document.querySelectorAll('.opt').forEach(b => b.classList.toggle('picked', +b.dataset.i === i));
  $('footBtn').disabled = false;
}

function check(){
  const {card, mp, answer, options} = L.q;
  let ok, typo = false;
  if (card.kind === 'sp') {
    const d = spellDistance($('spell').value, answer);
    ok = d <= (answer.length > 12 ? 2 : 1); typo = ok && d > 0;
    $('spell').disabled = true; $('spell').classList.add(ok ? 'right' : 'wrong');
    if (!ok) $('spell').classList.add('shake');
  } else ok = options[L.picked] === answer;
  L.answered = true;
  const first = !(card.key in L.firstTry);
  if (first) L.firstTry[card.key] = ok;

  // spaced repetition: only the first try in a lesson moves the card between boxes
  const st = S.cards[card.key] || {box:0, due:0, right:0, wrong:0};
  if (first){
    if (ok){ st.box = Math.min(st.box + 1, MAX_BOX); st.right++; }
    else { st.box = 0; st.wrong++; }
    st.due = Date.now() + INTERVALS[st.box];
    S.cards[card.key] = st;
  }

  L.queue.shift();
  if (ok){
    L.done++; L.combo++; L.bestCombo = Math.max(L.bestCombo, L.combo);
    if (first) L.correctFirst++;
    let gain = first && !L.hint ? 10 : 5;
    if (L.combo > 0 && L.combo % 5 === 0) gain += 5;
    L.xp += gain;
  } else {
    L.combo = 0;
    if (!L.missed.includes(mp.id)) L.missed.push(mp.id);
    // missed card comes back a few questions later in this lesson
    L.queue.splice(Math.min(3, L.queue.length), 0, card);
  }
  save();
  beep(ok);

  document.querySelectorAll('.opt').forEach(b => {
    b.disabled = true; b.classList.remove('picked');
    const v = options[+b.dataset.i];
    if (v === answer) b.classList.add('right');
    else if (+b.dataset.i === L.picked) b.classList.add('wrong', 'shake');
  });
  $('bar').style.width = `${100*L.done/L.total}%`;
  $('combo').textContent = L.combo >= 2 ? `🔥 ${L.combo}` : '';

  const cheers = ['Nice!','Great job!','Correct!','You got it!','Excellent!'];
  $('foot').className = 'foot ' + (ok ? 'ok' : 'bad');
  $('fb').innerHTML = `<img src="${photo(mp.id)}" alt="">
    <div><div class="h">${!ok ? 'Correct answer:' : typo ? 'Close! Watch the spelling:' : cheers[Math.floor(Math.random()*cheers.length)]}</div>
    <div class="ans">${esc(mp.name)} · ${esc(mp.riding || mp.role)} (${PROV_ABBR[mp.prov]||esc(mp.prov)}) · ${esc(partyLabel(mp))}</div></div>`;
  $('footBtn').textContent = 'Continue';
  $('footBtn').classList.remove('pop'); void $('footBtn').offsetWidth; $('footBtn').classList.add('pop');
}

$('footBtn').onclick = () => {
  if (!L) return;
  if (!L.answered){ if (L.q.card.kind === 'sp' ? $('spell').value.trim() : L.picked !== null) check(); }
  else nextQuestion();
};
$('quitBtn').onclick = () => { if (confirm('Quit this lesson? Answers so far are saved.')) { L = null; $('foot').classList.add('hidden'); renderHome(); } };

document.addEventListener('keydown', e => {
  if ($('lesson').classList.contains('hidden') || !L) return;
  if (!L.answered && L.q.card.kind !== 'sp' && e.key >= '1' && e.key <= '4'){ const i = +e.key - 1; if (i < L.q.options.length) { pick(i); } }
  if (e.key === 'Enter'){ e.preventDefault(); $('footBtn').click(); }
});

function finishLesson(){
  $('foot').classList.add('hidden');
  const acc = Math.round(100 * L.correctFirst / L.total);
  if (acc === 100) L.xp += 10;
  S.xp += L.xp;
  S.best[L.level] = Math.max(S.best[L.level] || 0, acc);
  bumpStreak();
  save();
  const unlockedNow = L.level < 3 && acc >= 80 && !S.unlockAll;
  const lvl = L.level, done = lessonsToday();
  $('results').innerHTML = `<header class="hdr"><div class="tt"><div class="eyebrow">Lesson complete</div><div class="big">${acc === 100 ? 'Perfect lesson! 🏆' : acc >= 80 ? 'Nice work! 🎉' : 'Keep going! 💪'}</div></div></header>
    <div class="res">
    <div class="drop">
      <div class="drop-top"><span class="live"></span>Level ${lvl}<span class="of">${esc(deckLabel(S.deck))}</span></div>
      ${unlockedNow ? `<h2>Level ${lvl+1} is open</h2><small>You scored 80% or more.</small>` : ''}
      <div class="nums">
        <div class="num"><b>+${L.xp}</b><span>XP</span></div>
        <div class="num"><b>${acc}%</b><span>accuracy</span></div>
        <div class="num"><b>${S.streak}</b><span>day streak</span></div>
      </div>
      <div class="track">${Array.from({length: DAILY_GOAL}, (_,i) => `<i class="${i < done ? 'done' : ''}"></i>`).join('')}</div>
      <div class="streak"><span>${done >= DAILY_GOAL ? '<b>Daily goal reached</b>' : `<b>${done} of ${DAILY_GOAL}</b> lessons today`}</span><span>Daily goal</span></div>
    </div>
    ${L.missed.length ? `<div class="sec">Review these</div>${L.missed.map(id => { const m = BY_ID[id]; return `<div class="rv"><img src="${photo(id)}" alt=""><div><div class="n">${esc(m.name)}</div><div class="r">${esc(m.riding)} · ${esc(m.prov)}</div></div></div>`; }).join('')}` : ''}
    <button class="btn" id="againBtn" style="margin-top:8px">Next lesson</button>
    <button class="btn ghost" id="homeBtn">Back to levels</button>
    </div>`;
  $('againBtn').onclick = () => startLesson(lvl);
  $('homeBtn').onclick = renderHome;
  L = null;
  show('results');
}

/* ---------- study grid ---------- */
function renderStudy(){
  const ids = deckIds(S.deck);
  const label = id => {
    const b = Math.min(...LEVELS.flatMap(Lv => Lv.kinds.map(k => box(`${k}:${id}`))));
    const seen = LEVELS.some(Lv => Lv.kinds.some(k => S.cards[`${k}:${id}`]));
    if (b >= MASTERED_BOX) return '<span class="s tag">Mastered</span>';
    return seen ? '<span class="s tag">Learning</span>' : '<span class="s tag grey">New</span>';
  };
  const sorted = ids.map(id => BY_ID[id]).sort((a,b) => a.last.localeCompare(b.last, 'fr'));
  $('study').innerHTML = `<header class="hdr"><button class="circ" id="studyClose" title="Back" aria-label="Back">←</button>
    <div class="tt"><div class="eyebrow">Study · ${ids.length} ${S.group === 'Senate' ? 'senators' : 'MPs'}</div><div class="big">${esc(deckLabel(S.deck))}</div></div></header>
    <div class="grid">${sorted.map(m => `<div class="gcard"><img src="${photo(m.id)}" alt="" loading="lazy">
      <div class="n">${esc(m.name)}</div><div class="r">${esc(m.riding || m.role)} · ${PROV_ABBR[m.prov]||esc(m.prov)}</div><div class="r">${esc(partyLabel(m))}</div>${label(m.id)}</div>`).join('')}</div>`;
  $('studyClose').onclick = renderHome;
  show('study');
}

renderHome();
</script>
